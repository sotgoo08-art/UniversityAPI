services:
  mongodb:
    image: mongo:8
    container_name: university-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: university-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/university_api
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 1h
      CORS_ORIGINS: http://localhost:3001
    depends_on:
      - mongodb

volumes:
  mongo_data:
